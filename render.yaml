services:
  - type: web
    name: student-registration
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: student-registration-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"

databases:
  - name: student-registration-db
    databaseName: students
    user: student_registration
    plan: free

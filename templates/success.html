{% extends "base.html" %}
{% block title %}Registration Submitted{% endblock %}
{% block content %}
<section class="panel success-panel">
  <div class="success-mark" aria-hidden="true">✓</div>
  <p class="eyebrow">REGISTRATION COMPLETE</p>
  <h1>Thank you, {{ confirmation.full_name }}!</h1>
  <p>Your registration has been received.</p>
  <div class="confirmation">
    <span>Your roll number</span>
    <strong>{{ confirmation.roll_number }}</strong>
  </div>
  <a class="button secondary" href="{{ url_for('register') }}">Return to form</a>
</section>
{% endblock %}

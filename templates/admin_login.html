{% extends "base.html" %}
{% block title %}Admin Login | Student Registration{% endblock %}
{% block content %}
<section class="panel login-panel">
  <p class="eyebrow">STAFF AREA</p>
  <h1>Admin Login</h1>
  <p>Sign in to manage student registrations.</p>
  {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('admin_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" value="{{ request.form.get('username', '') }}" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="button primary submit-button" type="submit">Log in</button>
  </form>
</section>
{% endblock %}
